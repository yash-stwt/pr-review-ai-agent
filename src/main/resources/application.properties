spring.application.name=ai-code-reviewer-backend
server.port=8081

# ── AI Routing Strategy ──────────────────────────────────────────────
ai.routing.strategy=TASK_BASED
ai.routing.task.deep-review=groq
ai.routing.task.fast-analysis=groq
ai.routing.task.security-review=groq
ai.routing.task.fix-generation=groq

# ── Groq Provider (primary) ─────────────────────────────────────────
ai.provider.groq.api-key=${GROQ_API_KEY}
ai.provider.groq.model=${GROQ_API_MODEL:llama-3.3-70b-versatile}
ai.provider.groq.api-url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
ai.provider.groq.timeout-seconds=30
ai.provider.groq.max-retries=2
ai.provider.groq.rate-limit.requests-per-minute=60
ai.provider.groq.cost-per-1k-tokens=0.0008

# ── Gemini Provider (optional — set GEMINI_API_KEY to enable) ────────
ai.provider.gemini.api-key=${GEMINI_API_KEY:}
ai.provider.gemini.model=gemini-3-flash-preview
ai.provider.gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models
ai.provider.gemini.timeout-seconds=45
ai.provider.gemini.max-retries=2
ai.provider.gemini.rate-limit.requests-per-minute=30
ai.provider.gemini.cost-per-1k-tokens=0.0035

# ── Claude Provider (optional — set CLAUDE_API_KEY to enable) ────────
ai.provider.claude.api-key=${CLAUDE_API_KEY:}
ai.provider.claude.model=claude-3-5-sonnet-20241022
ai.provider.claude.api-url=https://api.anthropic.com/v1/messages
ai.provider.claude.timeout-seconds=40
ai.provider.claude.max-retries=2
ai.provider.claude.rate-limit.requests-per-minute=40
ai.provider.claude.cost-per-1k-tokens=0.003

# ── File Analysis ────────────────────────────────────────────────────
ai.file-analysis.max-parallel=4
ai.file-analysis.chunk-size=300
ai.file-analysis.async-threshold=20

# ── Cache ────────────────────────────────────────────────────────────
ai.cache.max-entries=100
ai.cache.ttl-minutes=10

# ── Timeouts ─────────────────────────────────────────────────────────
ai.response-timeout-seconds=60
